name: maps

# Rebuilds the HD battle minimaps and pushes them to `unicum-gg/wot.maps`.
#
# A minimap is a DXT surface inside its own map package, so one map costs one
# range-downloaded block rather than the whole part. The mirror keeps one branch
# per client build, the CT one being where a new map shows up first.
on:
  schedule:
    - cron: "0 6 * * *" # daily, after sources and assets
  workflow_dispatch:
    inputs:
      force:
        # The version guard skips a run whose client is already mirrored, which
        # is right for a schedule and wrong right after this generator changes:
        # the output would differ but the version does not.
        description: "Re-extract even when the client version is unchanged"
        type: boolean
        default: false

concurrency:
  group: maps
  cancel-in-progress: false

env:
  TARGET: unicum-gg/wot.maps

jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - branch: WG
            host: wgus-woteu.wargaming.net
            guid: WOT.EU.PRODUCTION
          - branch: WG_CT
            host: wgus-wotct.wargaming.net
            guid: WOT.CT.PRODUCTION
          - branch: Lesta
            host: lstus-ru.lesta.ru
            guid: MT.RU.PRODUCTION
          - branch: Lesta_PT
            host: lstus-ru.lesta.ru
            guid: MT.PT.PRODUCTION

    steps:
      - uses: actions/checkout@v4

      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      - name: Checkout the target branch
        run: |
          git config --global user.name "wot.build"
          git config --global user.email "actions@users.noreply.github.com"
          git clone --depth 1 --branch "${{ matrix.branch }}" \
            "https://x-access-token:${{ secrets.SYNC_PAT }}@github.com/${TARGET}.git" out

      - name: Generate (no-op if the client version is unchanged)
        run: npm run maps -- --host "${{ matrix.host }}" --guid "${{ matrix.guid }}" --out out --all ${{ inputs.force && '--force' || '' }}

      - name: Commit & push if changed
        working-directory: out
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "no changes for ${{ matrix.branch }}"
            exit 0
          fi
          git commit -m "🍱 update ${{ matrix.branch }} minimaps to $(cat .version_name)"
          git push origin "HEAD:${{ matrix.branch }}"
