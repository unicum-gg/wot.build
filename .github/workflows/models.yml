name: models

# Rebuilds the vehicle geometry and pushes it to `unicum-gg/wot.models`.
#
# The heaviest of the four: a run reads every package family, since a vehicle's
# pieces are split across its tier's parts and the textures a nation shares live
# in the shared ones. Measured at just under three hours and twenty gigabytes for
# the release branch.
#
# **A branch seeds itself.** A push is capped at 2 GB and a first import is the
# whole mirror at once, which is why this used to have to be done by hand. It is
# done here instead: a branch that does not exist yet is started empty, and the
# vehicles are committed and pushed in chunks that stay under the cap. Every run
# after that pushes only what a patch changed, which is one small chunk.
on:
  schedule:
    - cron: "0 7 * * *" # daily, after sources, assets and maps
  workflow_dispatch:
    inputs:
      force:
        # The version guard skips a run whose client is already mirrored, which
        # is right for a schedule and wrong right after this generator changes:
        # the output would differ but the version does not.
        description: "Re-extract even when the client version is unchanged"
        type: boolean
        default: false
      skins:
        # 237 vehicles declare 330 of them between them, each a full set of
        # pieces with textures of its own, so they roughly double the mirror.
        description: "Also publish the 3D styles"
        type: boolean
        default: false

concurrency:
  group: models
  cancel-in-progress: false

env:
  TARGET: unicum-gg/wot.models

jobs:
  models:
    runs-on: ubuntu-latest
    # A release branch measured 5h07 on a runner, against the six hours a job
    # gets. What is left after that is for the pushes, so this sits as close to
    # the ceiling as it can: the first seed died with half an hour of headroom.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - branch: WG
            host: wgus-woteu.wargaming.net
            guid: WOT.EU.PRODUCTION
          - branch: WG_CT
            host: wgus-wotct.wargaming.net
            guid: WOT.CT.PRODUCTION
          - branch: Lesta
            host: lstus-ru.lesta.ru
            guid: MT.RU.PRODUCTION
          - branch: Lesta_PT
            host: lstus-ru.lesta.ru
            guid: MT.PT.PRODUCTION

    steps:
      - uses: actions/checkout@v4

      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Free disk space
        # The scratch tree holds a package family at a time and the output is
        # twenty gigabytes, so the runner's own toolchains have to go.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      - name: Checkout the target branch, or start it
        run: |
          git config --global user.name "wot.build"
          git config --global user.email "actions@users.noreply.github.com"
          remote="https://x-access-token:${{ secrets.SYNC_PAT }}@github.com/${TARGET}.git"
          if git clone --depth 1 --branch "${{ matrix.branch }}" "$remote" out; then
            exit 0
          fi
          # A client this mirror has never carried. Started from nothing rather
          # than from the default branch: the two share no history and a mirror
          # branch is not a fork of a readme.
          git clone --depth 1 "$remote" out
          cd out
          git checkout --orphan "${{ matrix.branch }}"
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +

      # **Before five hours of work, not after.** A seed generated the whole
      # mirror and then found the token could not write to it, which is a
      # runner-day for a permission that takes a second to read.
      #
      # **Asked of the write path itself.** Reading `permissions.push` off the
      # repository answers for the human the token belongs to, not for the
      # token: a fine-grained one that was never granted this repository still
      # reports its owner's push rights, so that check went green and the push
      # was refused five hours later all the same. Creating a ref that already
      # exists is refused for the right reason instead: 422 where the token may
      # write, 403 where it may not, and nothing changes either way.
      - name: Check the token can write to the mirror
        run: |
          sha=$(curl -sf -H "Authorization: Bearer ${{ secrets.SYNC_PAT }}" \
            "https://api.github.com/repos/${TARGET}/git/ref/heads/main" | jq -r .object.sha)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_PAT }}" \
            "https://api.github.com/repos/${TARGET}/git/refs" \
            -d "{\"ref\":\"refs/heads/main\",\"sha\":\"${sha}\"}")
          case "$code" in
            422|201) echo "SYNC_PAT can write to ${TARGET}" ;;
            *)
              echo "::error::SYNC_PAT cannot write to ${TARGET} (HTTP ${code}). A fine-grained token lists the repositories it may touch and the permissions it has on them: add this one, with Contents read and write."
              exit 1 ;;
          esac

      - name: Generate (no-op if the client version is unchanged)
        run: npm run models -- --host "${{ matrix.host }}" --guid "${{ matrix.guid }}" --out out ${{ inputs.force && '--force' || '' }} ${{ inputs.skins && '--skins' || '' }}

      - name: Commit & push in chunks
        working-directory: out
        env:
          VERSION_BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          version="$(cat .version_name)"
          sent=0
          # A push carries the objects the remote does not have, so the cap is
          # per push rather than per commit: each chunk goes out before the next
          # one is staged. Well under the 2 GB limit, since a chunk is measured
          # on disk and git counts it compressed plus its own overhead.
          send() {
            if git diff --cached --quiet; then return 0; fi
            git commit -q -m "🍱 update ${VERSION_BRANCH} vehicle geometry to ${version}"
            git push -q origin "HEAD:${VERSION_BRANCH}"
            sent=$((sent + 1))
            echo "pushed chunk ${sent}"
          }
          budget=0
          for dir in vehicles/*/*; do
            [ -d "$dir" ] || continue
            size=$(du -sm "$dir" | cut -f1)
            if [ "$budget" -gt 0 ] && [ $((budget + size)) -gt 1000 ]; then
              send
              budget=0
            fi
            git add -A -- "$dir"
            budget=$((budget + size))
          done
          send
          # **The catalogue goes last, on purpose.** It is the list of what the
          # mirror carries, so publishing it before the vehicles it names would
          # send a reader after files that are not there yet. A seed that dies
          # half way leaves a branch that is merely incomplete rather than one
          # that lies about itself.
          git add -A
          send
          if [ "$sent" -eq 0 ]; then echo "no changes for ${VERSION_BRANCH}"; fi

  warm:
    # Filling jsDelivr with what was just published, so that the first reader
    # after a rebuild is not the one who waits for it.
    #
    # **A job of its own rather than a last step.** The generation runs to five
    # hours against a timeout of 350 minutes, and there is no room left in that
    # budget for twenty minutes of anything else: a pass added on the end would
    # be the thing that gets cut when a client update runs long, which is
    # exactly the run that needs it most.
    #
    # **Only the branches the site serves.** WG is what a tank page reads and
    # WG_CT what it reads for a vehicle on the test client. Lesta and Lesta_PT
    # are mirrored so the history exists, but no reader asks for them, and
    # warming a branch nobody opens spends jsDelivr's origin bandwidth on
    # nothing.
    needs: models
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      - name: Warm the branches the site reads
        env:
          # For resolving each branch to the commit a reader is served, which
          # is anonymous at 60 an hour on an address shared with every other
          # job on the runner.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run warm -- --branch WG --branch WG_CT
